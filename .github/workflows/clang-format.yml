name: clang-format

on:
  push:
    branches:
      - main
      - dev*
    paths:
      - 'ext/**'
      - '.github/workflows/clang-format.yml'
  pull_request:
    paths:
      - 'ext/**'
      - '.github/workflows/clang-format.yml'

jobs:
  clang-format:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: jdx/mise-action@v5
      with:
        mise_toml: |
          [tools]
          clang-format = "18"
    - run: clang-format --version
    - name: Install zsh
      run: sudo apt-get update && sudo apt-get install -y zsh
    - name: Run clang-format
      shell: zsh {0}
      run: clang-format --style=file --Werror --dry-run ext/**/*.h ext/**/*.c
