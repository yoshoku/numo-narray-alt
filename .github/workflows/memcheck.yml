name: memcheck

on:
  push:
    branches:
      - main
      - dev*
  pull_request:

jobs:
  ruby-memcheck:
    runs-on: ubuntu-latest
    name: ruby-memcheck
    env:
      BUNDLE_WITH: memcheck
    steps:
      - uses: actions/checkout@v7
      - name: Install glibc debug symbols for valgrind
        run: sudo apt-get update && sudo apt-get install -y libc6-dbg
      - name: Install valgrind
        uses: jdx/mise-action@v5
        with:
          mise_toml: |
            [settings]
            experimental = true
            [tools]
            "conda:valgrind" = "3.25.1"
      - run: valgrind --version
      - name: Set up Ruby 3.4
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.4
          bundler-cache: true
      - name: Run test
        run: bundle exec rake test:valgrind
